# Status: implemented routing configuration; live subscription/team verification
# is described in anthropic-subscription-proxy.md. This separate loopback port
# allows evaluation alongside a gateway on port 5022.
bind_addr: "127.0.0.1:5023"
request_timeout_secs: 1800
connect_timeout_secs: 10

# Claude Code supplies and refreshes its subscription OAuth bearer token.
# The origin is validated at startup; there is no API key or fallback provider.
#
# No `rules` are declared, so the Anthropic first-party model families
# (`claude-fable-*`, `claude-opus-*`, `claude-haiku-*`) use the subscription.
# A subagent's `model:` frontmatter is the selector, and Claude Code resolves a
# short alias to a full id before sending it:
#
#   model: fable             -> claude-fable-*  -> subscription
#   model: opus              -> claude-opus-*   -> subscription
#   model: haiku             -> claude-haiku-*  -> subscription
#   model: local-coder       -> the local route below (translated)
#
# The family set decides, not the route table: a `claude-opus-*` entry below would
# not divert that model to a local backend. Declaring explicit `rules` replaces
# this default.
anthropic_passthrough:
  upstream_origin: "https://api.anthropic.com"

# Both vLLM servers must advertise this exact model ID from GET /v1/models.
# These non-Anthropic aliases use the canonical Responses engine and Chat
# Completions transport, so an agent declaring one reaches a local replica.
model_routes:
  "local-coder":
    upstream_base_url: "http://127.0.0.1:8000/v1"
    upstream_model: "deepseek-ai/DeepSeek-V4.1-Flash"
  "local-fast":
    upstream_base_url: "http://127.0.0.1:8001/v1"
    upstream_model: "deepseek-ai/DeepSeek-V4.1-Flash"
